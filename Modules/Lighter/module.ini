# Optional replacement for the viewer's main world renderer.
format=1
id=lighter
name=Lighter
version=1.0.0
description=Trace the world from the camera instead of drawing the native raster scene. Software RT traverses a compute BVH; Hardware RT builds Vulkan acceleration structures and issues native GPU ray queries. Both use the same world-space materials, light transport, edge-aware denoising, progressive sampling, soft sun shadows, glossy reflections and water rays. Settings are saved independently. Restart Explorer after first selecting a ray backend.
