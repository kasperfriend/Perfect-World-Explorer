# Perfect World Explorer installed module package.
# The executable discovers this manifest beside Perfect-World-Explorer.exe.
format=1
id=imaginator
name=Imaginator
version=1.0.0
description=Real ray tracing for the loaded world. A software path tracer and a hardware DXR tracer both intersect rays against the map's own geometry - terrain, water planes, lit scenery and vegetation - and add what the raster renderer cannot produce: cast shadows (the core has no shadow map, so every surface currently receives full sun), interreflected light after a configurable number of bounces, and true mirror reflections. Separate switches for reflections, lighting and shadows; a tracer selector between Software (CPU) and Hardware (DXR), with the reason reported when the hardware path is unavailable; sliders for bounces, rays per pixel, traced-image scale and strength; and a diagnostic mode that shows the traced picture alone. The traced terms are composited into the finished frame after the upscaler and before the present encode, so the core's own water reflection pass, its shadow-free lighting and every existing visual setting stay exactly as they are. Settings live in Modules/Imaginator/settings.ini and load with a saved setup.
