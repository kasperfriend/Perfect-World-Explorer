# Perfect World Explorer installed module package.
# The executable discovers this manifest beside Perfect-World-Explorer.exe.
format=1
id=imaginator
name=Imaginator
version=1.0.0
description=Experimental ray tracing of captured world geometry. Full traced image replaces raster pixels but the underlying raster work still runs. Software uses tree texture colours and alpha cutouts; terrain and scenery still use approximate flat materials. Hardware DXR uses opaque flat materials and requires a compatible GPU and compiled shader. The scene is budget-limited and streamed; check the status and log for clipping or failures.
