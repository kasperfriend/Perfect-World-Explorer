name: Manual Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag, e.g. v0.1.0 or v0.1.0-beta.1'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-windows-release
  cancel-in-progress: false

jobs:
  checks:
    name: Check release source (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all binary targets
        run: cargo check --locked --bins
      - name: Run viewer unit tests
        run: cargo test --locked --bin perfect-world-explorer

  shader:
    name: Compile the RayQuery shader to DXIL
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find or install DXC
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe",
            "${env:VULKAN_SDK}\Bin\dxc.exe",
            "C:\VulkanSDK\*\Bin\dxc.exe"
          )
          foreach ($pattern in $candidates) {
            $found = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) {
              "DXC_PATH=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
              exit 0
            }
          }
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\vulkan-sdk.exe"
          Start-Process -FilePath "$env:TEMP\vulkan-sdk.exe" -Wait -ArgumentList `
            "--accept-licenses","--default-answer","--confirm-command","install","com.lunarg.vulkan.core","com.lunarg.vulkan.d3d12"
          $dxc = Get-ChildItem -Path "C:\VulkanSDK\*\Bin\dxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe was not installed" }
          "DXC_PATH=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compile the trace shader
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Modules\Imaginator\imaginator" | Out-Null
          $out = "Modules\Imaginator\imaginator\dxr_trace.cso"
          $proc = Start-Process -FilePath $env:DXC_PATH -ArgumentList @(
            "-T","cs_6_5","-E","cs","-HV","2018","-O3","-Zpc","-all_resources_bound",
            "-Fo",$out,"tools\imaginator-shaders\dxr_trace.hlsl") `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "dxc-output.txt" -RedirectStandardError "dxc-stderr.txt"
          if ($proc.ExitCode -ne 0) {
            Get-Content dxc-stderr.txt, dxc-output.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            throw "dxc exited with code $($proc.ExitCode)"
          }
          $size = (Get-Item -LiteralPath $out).Length
          if ($size -lt 256) { throw "the blob is only $size bytes; dxc did not produce DXIL" }
          Write-Host "wrote $out ($size bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: dxr-trace-dxil
          path: Modules/Imaginator/imaginator/dxr_trace.cso
          if-no-files-found: error

  release:
    name: Build and publish Windows release
    needs: [checks, shader]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw 'Use a version tag such as v0.1.0 or v0.1.0-beta.1.'
          }
          $found = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not query existing tags.' }
          if ($found) { throw "Tag $env:RELEASE_TAG already exists; choose a new one." }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Rebuild the embedded 32-bit SpeedTree bridge
        shell: msys2 {0}
        run: g++ -static -O2 -municode tools/speedtree/bake.cpp -o tools/speedtree/speedtree-bake.exe
      - uses: Swatinem/rust-cache@v2
      - name: Build standalone viewer
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin perfect-world-explorer
      - name: Install the compiled RayQuery shader
        uses: actions/download-artifact@v4
        with:
          name: dxr-trace-dxil
          path: Modules/Imaginator/imaginator
      - name: Verify the RayQuery shader ships in the release
        shell: pwsh
        run: |
          $blob = "Modules\Imaginator\imaginator\dxr_trace.cso"
          if (-not (Test-Path -LiteralPath $blob -PathType Leaf)) {
            throw "the release has no RayQuery shader at $blob"
          }
          $bytes = [System.IO.File]::ReadAllBytes($blob)
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes[0..3])
          if ($bytes.Length -lt 256 -or $magic -ne 'DXBC') {
            throw "the RayQuery shader is not a usable DXIL container ($($bytes.Length) bytes, magic '$magic')"
          }
          Write-Host "RayQuery shader: $($bytes.Length) bytes"
      - name: Stage portable release ZIP and checksum
        shell: pwsh
        run: |
          ./tools/package-windows.ps1 `
            -Executable target/x86_64-pc-windows-msvc/release/perfect-world-explorer.exe `
            -Modules Modules `
            -OutputDirectory release `
            -ArchivePath release/Perfect-World-Explorer-Windows-x64.zip
      - name: Publish GitHub release at the selected commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $args = @('release', 'create', $env:RELEASE_TAG, 'release/Perfect-World-Explorer-Windows-x64.zip', 'release/SHA256SUMS.txt', '--target', $env:GITHUB_SHA, '--title', "Perfect World Explorer $env:RELEASE_TAG", '--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
