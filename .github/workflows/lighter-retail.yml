name: Lighter retail capture matrix

# Optional evidence, not a required PR check. Use the same public client tree
# for maps and packages; never cache or upload client asset bytes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Compare matched Native and Software cameras on CPU Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch matching map files and packages
        run: |
          set -euo pipefail
          while read -r id sha file; do
            [[ -n "$id" && "$id" != \#* ]] || continue
            path="${RUNNER_TEMP}/lighter-client/element/$file"
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 2 --max-time 240 -o "$path" \
              "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" || {
                echo "::error::Could not fetch $file from the public client tree"; exit 1;
              }
            if ! printf '%s  %s\n' "$sha" "$path" | sha256sum -c -; then
              echo "::error::Unexpected bytes for $file; refusing mismatched client inputs"
              exit 1
            fi
          done < tools/fixtures/lighter-retail-inputs.txt
          # Both records have the same pinned 32-byte empty cloud header.
          cp "$RUNNER_TEMP/lighter-client/element/maps/a01/a01.cld" \
            "$RUNNER_TEMP/lighter-client/element/maps/a07/a07.cld"
      - name: Select the CPU Vulkan driver
        run: |
          set -euo pipefail
          # Native and Lighter read back on the same adapter. The headless
          # path has no X11 dependency; prefer the runner's Mesa if present.
          icd="$(find /usr/share/vulkan/icd.d -iname '*lvp*.json' -print -quit 2>/dev/null || true)"
          if [[ -z "$icd" ]]; then
            dir="$RUNNER_TEMP/pinned-lavapipe"
            mkdir -p "$dir"
            file="$dir/driver.tgz"
            curl -fsS --retry 2 --max-time 90 -o "$file" \
              'https://registry.npmjs.org/@drawcall/webgpu-linux-x64/-/webgpu-linux-x64-0.2.1.tgz'
            expected='SoiVjq+d8+uIUlxWgKEIqOfrvSy1k3KedcOqrvP3s67J8oF1Nd2ur32hFg/8IvhhpEm+NGF7GIjk3GTlxNSb0g=='
            test "$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)" = "$expected"
            tar -xzf "$file" --strip-components=1 -C "$dir" package/libvulkan_lvp.so package/libvulkan.so.1
            icd="$dir/lvp_icd.json"
            printf '{"file_format_version":"1.0.0","ICD":{"library_path":"%s/libvulkan_lvp.so","api_version":"1.3.0"}}\n' "$dir" > "$icd"
            echo "LD_LIBRARY_PATH=$dir" >> "$GITHUB_ENV"
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "GALLIVM_PERF=nopt" >> "$GITHUB_ENV"
      - name: Build viewer
        run: cargo build --locked --bin perfect-world-explorer
      - name: Compare matched day, night and rain cameras
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
          PW_CACHE_DIR: ${{ runner.temp }}/lighter-cache
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lighter-python"
          py="$RUNNER_TEMP/lighter-python/bin/python"
          "$py" -m pip install --disable-pip-version-check Pillow==11.3.0
          "$py" -m unittest discover -s tools -p test_lighter_capture_matrix.py
          "$py" tools/lighter_capture_matrix.py \
            --profile cpu --manifest tools/fixtures/lighter-retail-scenes.json \
            --viewer target/debug/perfect-world-explorer --client "$RUNNER_TEMP/lighter-client" \
            --output target/lighter-retail --ray-resolution 25 --timed-frames 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighter-retail-matrix
          path: target/lighter-retail/
          if-no-files-found: warn
