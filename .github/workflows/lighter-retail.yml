name: Lighter retail coverage

# Optional evidence, not a required PR check. Use the same public client tree
# for maps and packages; never cache or upload client asset bytes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lighter-retail.yml'

permissions:
  contents: read

jobs:
  capture:
    name: Compare authored scenery and a07 shoreline on CPU Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch matching map files and packages
        run: |
          set -euo pipefail
          while read -r id sha file; do
            [[ -n "$id" && "$id" != \#* ]] || continue
            path="${RUNNER_TEMP}/lighter-client/element/$file"
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 2 --max-time 240 -o "$path" \
              "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" || {
                echo "::error::Could not fetch $file from the public client tree"; exit 1;
              }
            if ! printf '%s  %s\n' "$sha" "$path" | sha256sum -c -; then
              echo "::error::Unexpected bytes for $file; refusing mismatched client inputs"
              exit 1
            fi
          done < tools/fixtures/lighter-retail-inputs.txt
      - name: Select the CPU Vulkan driver
        run: |
          set -euo pipefail
          # Native and Lighter read back on the same adapter. The headless
          # path has no X11 dependency; prefer the runner's Mesa if present.
          icd="$(find /usr/share/vulkan/icd.d -iname '*lvp*.json' -print -quit 2>/dev/null || true)"
          if [[ -z "$icd" ]]; then
            dir="$RUNNER_TEMP/pinned-lavapipe"
            mkdir -p "$dir"
            file="$dir/driver.tgz"
            curl -fsS --retry 2 --max-time 90 -o "$file" \
              'https://registry.npmjs.org/@drawcall/webgpu-linux-x64/-/webgpu-linux-x64-0.2.1.tgz'
            expected='SoiVjq+d8+uIUlxWgKEIqOfrvSy1k3KedcOqrvP3s67J8oF1Nd2ur32hFg/8IvhhpEm+NGF7GIjk3GTlxNSb0g=='
            test "$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)" = "$expected"
            tar -xzf "$file" --strip-components=1 -C "$dir" package/libvulkan_lvp.so package/libvulkan.so.1
            icd="$dir/lvp_icd.json"
            printf '{"file_format_version":"1.0.0","ICD":{"library_path":"%s/libvulkan_lvp.so","api_version":"1.3.0"}}\n' "$dir" > "$icd"
            echo "LD_LIBRARY_PATH=$dir" >> "$GITHUB_ENV"
            echo "GALLIVM_PERF=nopt" >> "$GITHUB_ENV"
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Build viewer
        run: cargo build --locked --bin perfect-world-explorer
      - name: Render and inventory both maps
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
          PW_CACHE_DIR: ${{ runner.temp }}/lighter-cache
          WGPU_BACKEND: vulkan
          PW_PREVIEW_LIGHTER: software
          PW_PREVIEW_COVERAGE: '1'
          PW_PREVIEW_ANISOTROPY: '8'
          PW_PREVIEW_WARMUP: '24'
        run: |
          set -euo pipefail
          mkdir -p target/lighter-retail
          test -n "$VK_ICD_FILENAMES"
          for map in a01 a02; do
            stem="target/lighter-retail/${map}-software"
            if ! target/debug/perfect-world-explorer "$RUNNER_TEMP/lighter-client" \
                --world "$map" --gpu-preview "$stem.png" >"$stem.log" 2>&1; then
              tail -8 "$stem.log" | tac | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
              exit 1
            fi
            test -s "$stem.png"
            grep -Fx "map=\"$map\"" "$stem.coverage.txt"
            # These totals are independent of the culling/ranking choices at
            # the camera; both live and omitted owners have to be accounted for.
            case "$map" in
              a01) bmd=328; effects=304 ;;
              a02) bmd=32; effects=42 ;;
            esac
            if ! awk -F, -v bmd="$bmd" -v effects="$effects" '
              $1=="near_terrain" { terrain=$2 }
              $1=="buildings" { placed=$2+$3+$4 }
              $1=="effect_roots" { roots=$2+$3+$4 }
              END { exit !(terrain>0 && placed==bmd && roots==effects) }
            ' "$stem.coverage.csv"; then
              grep -E '^(near_terrain|buildings|effect_roots),' "$stem.coverage.csv" |
                while IFS= read -r line; do printf '::error::%s %s\n' "$map" "$line"; done
              exit 1
            fi
            echo "::notice::$map $(grep '^rgba8_sha256=' "$stem.coverage.txt")"
            grep -Eq '^mip_authored_levels=[1-9][0-9]*$' "$stem.coverage.txt"
            echo "::notice::$map $(grep '^mip_' "$stem.coverage.txt" | tr '\n' ' ')"
            for row in near_terrain buildings effect_roots effect_draws; do
              echo "::notice::$map $(grep "^$row," "$stem.coverage.csv")"
            done
            {
              echo "### $map — Software / lavapipe"
              echo '```'
              cat "$stem.coverage.txt" "$stem.coverage.csv"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Capture the same authored shoreline in Native and Software
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
          PW_CACHE_DIR: ${{ runner.temp }}/lighter-cache
          WGPU_BACKEND: vulkan
          PW_PREVIEW_HOUR: '12'
        run: |
          set -euo pipefail
          # Overlook the authored wet cell near x=16, z=48 at y=330.83.
          camera=(16 356 84 0 -0.60)
          for mode in off software; do
            stem="target/lighter-retail/a07-$mode"
            audit=()
            if [[ "$mode" == software ]]; then audit=(PW_PREVIEW_COVERAGE=1 PW_PREVIEW_WARMUP=0); fi
            if ! env "${audit[@]}" PW_PREVIEW_LIGHTER="$mode" target/debug/perfect-world-explorer \
                "$RUNNER_TEMP/lighter-client" --world a07 --gpu-preview-at "${camera[@]}" "$stem.png" \
                >"$stem.log" 2>&1; then
              tail -10 "$stem.log" | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
              exit 1
            fi
            test -s "$stem.png"
            grep '^GPU adapter:' "$stem.log"
          done
          grep -Fx 'map="a07"' target/lighter-retail/a07-software.coverage.txt
          awk -F, '$1=="water" { found=$2 } END { exit !(found==1) }' \
            target/lighter-retail/a07-software.coverage.csv
          sha256sum target/lighter-retail/a07-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: lighter-retail-coverage
          path: |
            target/lighter-retail/*.png
            target/lighter-retail/*.coverage.*
            target/lighter-retail/a07-*.log
          if-no-files-found: error
