name: Temporary Architect rustfmt

on:
  push:
    branches:
      - feature/architect-world-editor
    paths:
      - .github/workflows/temporary-architect-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Rust sources already formatted"
            exit 0
          fi
          git commit -m "Format Architect editor sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
