name: PR checks and Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          # The runner's package mirror fails intermittently: `apt-get` exits 100
          # or stalls on the index fetch, and because every later step depends on
          # this one the whole Rust job is skipped (unit tests, type check and
          # rustfmt never run) on a change that builds fine elsewhere. So: skip
          # apt when the headers are already installed, bound every attempt with
          # `timeout`, retry, and still fail the step if all attempts fail.
          packages="libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev"
          missing=""
          for package in $packages; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -z "$missing" ]; then
            echo "Linux build dependencies already installed"
            exit 0
          fi
          echo "installing:$missing"
          status=1
          for attempt in 1 2 3; do
            if { timeout 240 sudo apt-get -o Acquire::Retries=2 update &&
              timeout 240 sudo apt-get install -y --no-install-recommends $missing; } 2>&1 | tee /tmp/apt.log; then
              status=0
              break
            fi
            echo "apt attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          if [ "$status" -ne 0 ]; then
            # The raw step log is served from blob storage and is not always
            # retrievable through the API, so repeat apt's own diagnosis as
            # annotations, the way the cargo steps below do.
            grep -v '^$' /tmp/apt.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Verify recovered regional arithmetic on x87
        run: |
          cc -O0 tools/check-native-region-reference.c -o /tmp/native-region-reference
          /tmp/native-region-reference
      - name: Test requirement status audits
        run: |
          python3 tools/test_phase1_ready.py
          python3 tools/test_eight_phase_status.py
          python3 tools/check-eight-phase-status.py
          python3 tools/audit-static-model-gpu-programs.py
          rustc --edition=2021 --test src/scenery_visibility.rs -o /tmp/scenery-visibility-tests
          /tmp/scenery-visibility-tests
          # Phase 5 sky-swap machine: standalone, so a failure names the recovered
          # count grid, the commit boundaries or the never-retarget guard directly
          # instead of only failing the viewer's test binary (P5.07).
          rustc --edition=2021 --test src/sky_transition.rs -o /tmp/sky-transition-tests
          /tmp/sky-transition-tests
          # Phase 5 sky panorama seam (P5.09): the two meridian bands of the
          # production `sky_gpu::sky` mapping, the layer-index group integrity and
          # both sides of a meridian, as pure arithmetic with no GPU and no assets.
          rustc --edition=2021 -O -o /tmp/phase5-sky-seam-check src/bin/phase5-sky-seam-check.rs
          /tmp/phase5-sky-seam-check
      - name: Check all binary targets
        run: |
          # Keep the plain command so a non-zero exit still fails the job, but
          # also echo the compiler diagnostics as check annotations: the raw
          # step log is not always retrievable from the API.
          # No `--message-format short` here: the short form drops the `-->`
          # file:line line, which is what actually locates a type error.
          CARGO_TERM_COLOR=never cargo check --locked --bins 2>&1 | tee /tmp/cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Preserve expected/found lines as well as the error and location;
            # one-line E0308 annotations are not actionable without the log.
            awk '/^error(\[|:)/{show=14} show>0 {print; show--}' /tmp/cargo-check.log \
              | head -120 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Test GFX light dependency audit
        run: |
          CARGO_TERM_COLOR=never cargo test --locked --bin gfx-light-audit 2>&1 | tee /tmp/gfx-audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^test result:|^error(\[|:)|panicked at" /tmp/gfx-audit.log | head -5 \
              | while IFS= read -r line; do echo "::error::$line"; done
            sed -n '/^failures:$/,/^test result:/p' /tmp/gfx-audit.log | head -20 \
              | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
          fi
          exit "$status"
      - name: Run viewer unit tests
        run: |
          CARGO_TERM_COLOR=never cargo test --locked --bin perfect-world-explorer 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Preserve compiler spans/help next to a test-only type error; the
            # remote log archive is not reliably accessible from the API.
            grep -A9 -E "^error(\[|:)" /tmp/cargo-test.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "^test result:|^error(\[|:)|panicked at" /tmp/cargo-test.log | head -5 \
              | while IFS= read -r line; do echo "::error::$line"; done
            # The failing test names, which is what actually needs naming.
            sed -n '/^failures:$/,/^test result:/p' /tmp/cargo-test.log | head -30 \
              | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
          fi
          exit "$status"
      # Formatting is checked after the unit tests and before the Vulkan
      # installs: rustfmt needs no GPU, so it must not sit behind an
      # environment-sensitive step, but it must not run *before* the tests
      # either — a formatting nit would then skip them, which is how three
      # assertions went unverified for a day.
      - name: Check formatting
        run: |
          # `cargo fmt --check` already prints the "Diff in ..." hunks it wants;
          # capture them because the raw step log is not always retrievable.
          # (`rustfmt --diff` is not an option, so this is the only source.)
          cargo fmt --all -- --check > /tmp/fmt.check 2>&1 || true
          if [ -s /tmp/fmt.check ]; then
            echo "::error::rustfmt wants changes; the diff is posted as a PR comment"
            exit 1
          fi
      # Job logs are not always retrievable through the API, and a PR comment is
      # not always posted either, so the diff also goes out as annotations: the
      # annotations are what the agent can read back.
      - name: Echo formatting diff
        if: failure()
        run: |
          [ -s /tmp/fmt.check ] || exit 0
          head -200 /tmp/fmt.check | while IFS= read -r line; do
            echo "::error file=rustfmt::$line"
          done
      # Annotations are capped per check run and the GPU checks fill it with
      # notices, so the diff is posted where it can actually be read.
      - name: Post formatting diff
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -n "$PR" ] || exit 0
          # An earlier failure leaves no rustfmt diff; post nothing rather than
          # an empty comment.
          [ -s /tmp/fmt.check ] || exit 0
          { echo 'rustfmt wants these changes:'; echo '```diff'; \
            head -600 /tmp/fmt.check; echo '```'; } > /tmp/fmt.md
          gh pr comment "$PR" --body-file /tmp/fmt.md
      - name: Verify bounded lossless terrain RAM residency
        run: |
          cargo run --locked --bin terrain-memory-check
          cargo run --locked --bin terrain-memory-check -- --full-world
      - name: Install software Vulkan for Phase 1 shader checks
        run: |
          # Same flaky mirror as the build dependencies above: retry the install
          # instead of failing the three Vulkan checks behind it, and print apt's
          # own diagnosis as annotations if every attempt fails.
          if dpkg -s mesa-vulkan-drivers >/dev/null 2>&1; then
            echo "mesa-vulkan-drivers already installed"
            exit 0
          fi
          status=1
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get install -y --no-install-recommends \
              mesa-vulkan-drivers 2>&1 | tee /tmp/vulkan-apt.log; then
              status=0
              break
            fi
            echo "apt attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          if [ "$status" -ne 0 ]; then
            grep -v '^$' /tmp/vulkan-apt.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Test Librarian preview with an sRGB window
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
          PW_LIBRARIAN_SYNTHETIC_GPU: "1"
        run: |
          # The raw step log is served from blob storage and is not reachable
          # from everywhere, so the failure is also encoded in the exit code,
          # which the check-run annotation always reports:
          #   41  no lavapipe ICD on the image   (probe fails, test never ran)
          #   42  the wgpu test itself failed
          log=/tmp/srgb-window.log
          : >"$log"
          # Mesa has renamed the software ICD more than once, so look for any
          # lavapipe driver description rather than one exact file name.
          icd=""
          for dir in /usr/share/vulkan/icd.d /usr/local/share/vulkan/icd.d /etc/vulkan/icd.d; do
            found="$(find "$dir" -maxdepth 1 -name '*lvp*' -print -quit 2>/dev/null || true)"
            if [ -n "$found" ]; then icd="$found"; continue; fi
          done
          echo "VK_ICD_FILENAMES=$icd" >>"$log"
          ls -l /usr/share/vulkan/icd.d >>"$log" 2>&1 || true
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD: the software Vulkan driver is missing"
            cat "$log"
            exit 41
          fi
          export VK_ICD_FILENAMES="$icd"
          status=0
          cargo test --locked --bin perfect-world-explorer \
            srgb_window_uses_encoded_unorm_preview_attachment 2>&1 | tee -a "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::sRGB window test failed"
            grep -E "panicked at|^test result:|^error(\[|:)|No suitable|RequestDevice" "$log" \
              | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 "$log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 42
          fi
      - name: Run Phase 1 production shader regressions
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          # Mesa renamed this file on newer Ubuntu images. Resolve the installed
          # lavapipe ICD rather than silently disabling Vulkan with a stale path.
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          # Name the binary that failed: this step runs 22 checks and a bare
          # exit code does not say which one broke.
          run_check() {
            # `if ! cmd | tee` tests *tee's* status, which is always 0, so the
            # failure branch never ran and every check silently passed. Take the
            # command's own status from PIPESTATUS.
            cargo run --locked --bin "$1" 2>&1 | tee "/tmp/gpu-$1.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::error::gpu check failed: $1"
              # The reason, not just the name: a shader mismatch reports the
              # expected and actual values on these lines.
              # The assert message itself, which carries the actual and
              # expected values, plus the panic location.
              grep -A3 -E "panicked at" "/tmp/gpu-$1.log" \
                | head -12 | while IFS= read -r line; do echo "::error::$1: $line"; done
              exit 1
            fi
          }
          run_check display-gamma-gpu-check
          run_check post-gpu-check
          run_check bloom-gpu-check
          run_check bmd-baked-gpu-check
          run_check bmd-sided-gpu-check
          run_check bmd-depth-gpu-check
          run_check scenery-pass-gpu-check
          run_check world-atlas-gpu-check
          run_check grass-instance-gpu-check
          run_check model-light-gpu-check
          run_check skin-pose-gpu-check
          run_check skin-palette-gpu-check
          run_check model-texture-gpu-check
          run_check model-receiver-gpu-check
          run_check model-draw-gpu-check
          run_check phase1-fog-gpu-check
          # Phase 5: native sky resource swap (`0x4203f4..0x420807` / `0x79aeb0`)
          # plus reflection and altitude invariants (P5.07, P5.08). Compiles the
          # production sky WGSL, proves the two-set crossfade changes pixels,
          # proves camera altitude cannot move a sky ray, and proves every view
          # reuses one snapshot without advancing the transition.
          run_check phase5-sky-transition-gpu-check
          # Validate both newly integrated P5 weather shaders on lavapipe. They
          # are otherwise only created when a user loads a client world.
          run_check phase5-weather-cloud-shader-check
          run_check terrain-refraction-gpu-check
          run_check water-fog-gpu-check
          # Near/far LOD continuity: runs both real terrain vertex entry points
          # (`vs`, `vs_far`) on identical geometry and compares the interpolated
          # normal in RGB plus the packed LOD flag in alpha.
          run_check terrain-lod-gpu-check
          # Phase 4 vegetation diagnostics: tree LOD/lighting preservation,
          # grass mip coverage/upload, and synthetic authored tree mip upload.
          run_check tree-lod-gpu-check
          run_check grass-gpu-mip-check
          run_check tree-authored-mip-gpu-check
      # The headless effect preview is the only place the effect pass is
      # rendered without a window. Its smoke case authors one sprite root and
      # asserts the card reaches the pass and covers pixels, so a change that
      # breaks the harness cannot quietly turn the other previews into a folder
      # of empty PNGs.
      - name: Run the headless effect preview smoke test
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          CARGO_TERM_COLOR=never cargo test --locked --bin perfect-world-explorer \
            effect_preview_smoke -- --nocapture 2>&1 | tee /tmp/effect-preview-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::effect preview smoke test failed"
            grep -E "panicked at|^error(\[|:)|^test result:|smoke:" /tmp/effect-preview-smoke.log \
              | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 /tmp/effect-preview-smoke.log \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Keep the effect preview smoke frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-preview-smoke
          path: /tmp/pwe-effect-preview-smoke.png
          if-no-files-found: ignore
      - name: Run terrain per-view GPU check
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          cargo run --locked --bin terrain-view-gpu-check
          cargo test --locked --bin perfect-world-explorer cutoff_gpu_residency_repacking -- --ignored

      # Formatting is cosmetic: run it after the compile, test and shader steps
      # so a whitespace diff can never hide a real failure behind it.
  windows:
    name: Windows executable (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Rebuild the embedded 32-bit SpeedTree bridge
        shell: msys2 {0}
        run: g++ -static -O2 -municode tools/speedtree/bake.cpp -o tools/speedtree/speedtree-bake.exe
      - uses: Swatinem/rust-cache@v2
      - name: Capture gamma words with native x86 MSVCRT exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x86 tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"
          $exe = Join-Path $env:RUNNER_TEMP "native-gamma.exe"
          $prefix = Join-Path $env:RUNNER_TEMP "native-gamma"
          $command = "call `"$vcvars`" && cl /nologo /W4 /O2 tools\capture-native-gamma-x87.c /Fe:`"$exe`" && `"$exe`" `"$prefix`""
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NativeGammaX87Words
          path: ${{ runner.temp }}/native-gamma-pc*.bin
          if-no-files-found: error
      - name: Compare production gamma with independent x86 MSVCRT words
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "compare-gamma-words.exe"
          rustc --edition=2021 tools/check-native-gamma-words.rs -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe (Join-Path $env:RUNNER_TEMP "native-gamma-pc24.bin")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native gamma and glow CPU references on Windows
        shell: pwsh
        run: |
          # Keep CPU references for both the P4 vegetation material policy and
          # the P5 sky-swap machine in the Windows-native verification set.
          foreach ($module in @("gamma_curve", "glow_state", "post_plan", "color_chain", "fog_matrix", "client_region_shade", "client_region_stream", "client_regional_light", "gfx_color_track", "vegetation_material", "sky_transition")) {
            $exe = Join-Path $env:RUNNER_TEMP "$module-tests.exe"
            rustc --edition=2021 --test "src/$module.rs" -o $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build standalone viewer
        shell: bash
        run: |
          CARGO_TERM_COLOR=never cargo build --locked --release --target x86_64-pc-windows-msvc --bin perfect-world-explorer 2>&1 | tee /tmp/win-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "(^error|: error)" /tmp/win-build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Build audio corpus and scene diagnostics
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin audio-corpus-check --bin scene-sound-check
      - name: Test Windows audio decoding with synthetic fixtures
        run: cargo test --locked --target x86_64-pc-windows-msvc --bin audio-corpus-check
      - name: Test world audio selection on Windows
        run: cargo test --locked --target x86_64-pc-windows-msvc --bin perfect-world-explorer world_audio::tests
      - name: Build the shipped survey tool
        shell: bash
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin bmd-overlap-survey
      - name: Stage portable viewer and installed modules
        shell: pwsh
        run: |
          # Validate the release ZIP too, but upload only the portable folder.
          ./tools/package-windows.ps1 `
            -Executable target/x86_64-pc-windows-msvc/release/perfect-world-explorer.exe `
            -Modules Modules `
            -OutputDirectory artifact `
            -ArchivePath "$env:RUNNER_TEMP/Perfect-World-Explorer-package-test.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Perfect-World-Explorer-Windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Download the uploaded portable artifact
        uses: actions/download-artifact@v4
        with:
          name: Perfect-World-Explorer-Windows-x64
          path: ${{ runner.temp }}/uploaded-viewer
      - name: Audit the uploaded artifact layout
        shell: pwsh
        run: |
          $uploaded = Join-Path $env:RUNNER_TEMP 'uploaded-viewer'
          $topLevel = @(Get-ChildItem -LiteralPath $uploaded -Force)
          if ($topLevel.Count -ne 1 -or $topLevel[0].Name -cne 'Perfect World Explorer') {
            throw 'The artifact must contain only the Perfect World Explorer top-level folder.'
          }
          $package = Join-Path $uploaded 'Perfect World Explorer'
          foreach ($relative in @('Perfect-World-Explorer.exe', 'Modules/Walker/module.ini', 'SHA256SUMS.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $relative) -PathType Leaf)) {
              throw "Uploaded artifact is missing: $relative"
            }
          }
          if (Get-ChildItem -LiteralPath $package -Recurse -File | Where-Object { $_.Name -match '(?i)bmd.*survey|survey.*bmd' }) {
            throw 'The uploaded artifact contains a BMD survey executable.'
          }
