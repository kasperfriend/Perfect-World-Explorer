name: PR checks and Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # `contents: write` is for the `ci-results` branch only: the measurement JSON
  # is committed there because the job log is not readable from the agent's
  # side, so a printed number is a number nobody can check.
  contents: write
  pull-requests: write
  # The Windows packaging audit downloads the artifact through the REST API.
  actions: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          # The runner's package mirror fails intermittently: `apt-get` exits 100
          # or stalls on the index fetch, and because every later step depends on
          # this one the whole Rust job is skipped (unit tests, type check and
          # rustfmt never run) on a change that builds fine elsewhere. So: skip
          # apt when the headers are already installed, bound every attempt with
          # `timeout`, retry, and still fail the step if all attempts fail.
          packages="libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev"
          missing=""
          for package in $packages; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -z "$missing" ]; then
            echo "Linux build dependencies already installed"
            exit 0
          fi
          echo "installing:$missing"
          status=1
          for attempt in 1 2 3; do
            if { timeout 240 sudo apt-get -o Acquire::Retries=2 update &&
              timeout 240 sudo apt-get install -y --no-install-recommends $missing; } 2>&1 | tee /tmp/apt.log; then
              status=0
              break
            fi
            echo "apt attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          if [ "$status" -ne 0 ]; then
            # The raw step log is served from blob storage and is not always
            # retrievable through the API, so repeat apt's own diagnosis as
            # annotations, the way the cargo steps below do.
            grep -v '^$' /tmp/apt.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Verify recovered regional arithmetic on x87
        run: |
          cc -O0 tools/check-native-region-reference.c -o /tmp/native-region-reference
          /tmp/native-region-reference
      - name: Verify NGX parameter names and setter types
        run: |
          # Every NVSDK_NGX parameter the DLSS / DLSS-G paths write, checked
          # against the vendored table from NVIDIA/DLSS v310.9.16: the name must
          # exist and the setter type must be the one NVIDIA's own create and
          # evaluate helpers use (`SetI` vs `SetUI` is a silent refusal, not a
          # compile error). Regenerate the table with
          # `tools/verify-ngx-params.py --headers DIR --dump-fixture F`.
          python3 tools/verify-ngx-params.py
      - name: Verify the vendored SDK binaries and their FFI constants
        run: |
          # The quality enums now live in `src/modes.rs`: NGX's
          # `PerfQualityValue`, the FFX upscaler's `qualityMode` and XeSS's
          # `qualitySetting`. A wrong value there is not a compile error — it is
          # a mode that renders at another mode's ratio, or one the driver
          # refuses at CreateFeature — so the table is checked against the
          # vendored headers (and the DLL exports, and the packaged layout).
          python3 tools/verify-vendor-sdks.py
      - name: Guard the offline harness against silent failures
        run: |
          # Two failure modes in `tools/offline_harness.sh` are invisible when
          # they happen, and both have already cost real test coverage:
          #
          #   1. A duplicated `case` label. The shell takes the first match, so
          #      the later arm is dead code. Two arms were once both labelled
          #      `music`, and the 27-test precinct suite behind one of them had
          #      never run.
          #   2. An unescaped backtick inside an unquoted heredoc body. The
          #      harness writes generated Rust through those heredocs, so the
          #      shell *executes* whatever sits between a pair of backticks and
          #      writes the empty result into the file. Four instances were found
          #      this way; the only symptom was one stray line on stderr.
          #
          # Neither is a compile error and neither fails a test, so this has to
          # be its own gate. `harness.sh check` runs it too; this makes it run on
          # a machine that has no offline toolchain.
          python3 tools/check-harness.py
          # Every binary reaches some `src/*.rs` module through `#[path]`, and
          # any `crate::x` inside those files has to be declared by the binary
          # too. `cargo check --bins` below is what really proves it, but it
          # fails one target at a time and its log is often unretrievable; this
          # names the file and the module without a toolchain. It is a closure
          # check, not a compile: a module can be declared and still need
          # `wgpu`, which is why the two are not redundant.
          for binary in src/bin/*.rs; do
            missing="$(python3 tools/binary-module-closure.py "$binary")" || exit 1
            if [ -n "$missing" ]; then
              echo "::error file=$binary::declares no module for: $missing"
              exit 1
            fi
            short="$(python3 tools/binary-field-closure.py "$binary")" || exit 1
            if [ -n "$short" ]; then
              echo "::error file=$binary::$short"
              exit 1
            fi
          done
      # The register quotes measurements of files that are not in this
      # checkout -- "the 1.8.4 precinct is 383 zones, 783 tracks" describes the
      # world map's 885 KB file, while the one staged beside the maps is 29
      # zones with no ambience. `matrix` and `instance` already read precincts;
      # this mode prints what a file actually holds, so a number in prose has
      # something to be checked against. It runs on whatever the workspace has
      # and is skipped, loudly, when nothing is staged.
      # `src/view_settings.rs`'s tests are P8.07 -- "all settings are
      # persistent, have clear defaults and apply consistently". They live in
      # `src/bin/...`-less module space and were only ever compiled by the
      # viewer binary, so no gate ran them. `settings` runs them, and its stub of
      # the five fps enums is generated from `main.rs` and checked for staleness,
      # because those enums ARE the persisted spellings.
      - name: Settings persistence
        # The step log cannot be read from the agent's side, and this step has
        # twice failed with no annotation at all, which makes the failure
        # undiagnosable. Capture the output and republish the tail as
        # annotations, which *are* readable. Chunked because an annotation is
        # capped in length.
        run: bash tools/ci-run-and-annotate.sh settings
      # The baked draw-state table: stage, alpha test, cull, blend and the
      # z-fight/winding rules, including which meshes a mirrored placement may
      # reverse. `cargo test` above does reach these, but only as part of the
      # whole viewer binary; this runs them alone, so a failure names the table.
      - name: Baked draw-state table
        run: bash tools/ci-run-and-annotate.sh bmd-baked
      # The decoded-texture cache, its byte-budgeted LRU and the world model
      # list. P3.08 cites the eviction test as its residency proof, and until
      # now nothing outside the viewer target compiled it.
      - name: Texture cache and world model list
        run: bash tools/ci-run-and-annotate.sh objects
      # The launcher's own tests. `src/launcher_ui.rs` is `#[cfg(windows)]`, so
      # nothing on this job compiled it; the mode strips its two `#[link]`
      # attributes into a copy and runs the module's five tests, including the
      # persistence of its low-memory checkbox.
      - name: Launcher settings
        run: bash tools/ci-run-and-annotate.sh launcher
      - name: Measure staged precinct files
        run: |
          # An array, not a newline-joined string: `$roots` unquoted from
          # `ls -d` splits on the newline and hands the binary one argument
          # that is two paths, which it then reports as a usage error.
          roots=()
          [ -d google_drive ] && roots+=(google_drive)
          for d in /tmp/clients/*/element/maps; do
            [ -d "$d" ] && roots+=("$d")
          done
          if [ ${#roots[@]} -eq 0 ]; then
            echo "::notice::no staged precinct.clt; the precinct census did not run"
            exit 0
          fi
          cargo run --locked --bin precinct-check -- "${roots[@]}"
      - name: Test requirement status audits
        run: |
          python3 tools/test_phase1_ready.py
          python3 tools/test_eight_phase_status.py
          # The archive census's own classification table. It reported 2,439
          # `.gfx`/`.sgc` effect members as unparsed because the table listed
          # neither extension; these tests keep that from happening again.
          python3 -m unittest tools.test_archive_census
          # The DDS survey's format table, checked against `model_dds.rs`
          # rather than against a pack -- its first version reported 33 members
          # as unreadable that the parser has always accepted.
          python3 -m unittest tools.test_dds_survey
          # The T2LM survey. The reader demanded a 256 tile edge while three of
          # the four staged `.t2lm` files are 128, so every login map and the
          # 128-tile world maps were refused outright. This pins the survey to
          # the reader for both shipped edges.
          python3 -m unittest tools.test_lightmap_survey
          # The EC-BSD survey measures `ECBSD_NAME_LIMIT`. The cap used to be
          # documented as unmeasurable because the staged packs hold no EC-BSD;
          # they live under `maps/world/` instead, and the largest real table is
          # 88 names against a limit of 10,000.
          python3 -m unittest tools.test_ecbsd_survey
          python3 tools/check-eight-phase-status.py
          # The register's row count is quoted in TODO.md and the PR body. It
          # said 62 while the file held 61, which is the kind of number nobody
          # re-derives. This prints it, and the status audit below fails if the
          # total the docs claim stops matching.
          python3 tools/count-register.py 61
          python3 tools/audit-static-model-gpu-programs.py
          # Every site that drops a load result must be classified, and every
          # allowance must still name a real site. The second half was missing:
          # the file is keyed path:line, so editing anything above an allowance
          # silently retargeted it to whatever line moved into its place, and a
          # stale one kept justifying code that had gone. It found two the first
          # time it ran.
          python3 tools/audit-silent-drops.py --check
          rustc --edition=2021 --test src/scenery_visibility.rs -o /tmp/scenery-visibility-tests
          /tmp/scenery-visibility-tests
          # Phase 5 sky-swap machine: standalone, so a failure names the recovered
          # count grid, the commit boundaries or the never-retarget guard directly
          # instead of only failing the viewer's test binary (P5.07).
          rustc --edition=2021 --test src/sky_transition.rs -o /tmp/sky-transition-tests
          /tmp/sky-transition-tests
          # Phase 5 sky panorama seam (P5.09): the two meridian bands of the
          # production `sky_gpu::sky` mapping, the layer-index group integrity and
          # both sides of a meridian, as pure arithmetic with no GPU and no assets.
          rustc --edition=2021 -O -o /tmp/phase5-sky-seam-check src/bin/phase5-sky-seam-check.rs
          /tmp/phase5-sky-seam-check
      - name: Check all binary targets
        run: |
          # Keep the plain command so a non-zero exit still fails the job, but
          # also echo the compiler diagnostics as check annotations: the raw
          # step log is not always retrievable from the API.
          # No `--message-format short` here: the short form drops the `-->`
          # file:line line, which is what actually locates a type error.
          CARGO_TERM_COLOR=never cargo check --locked --bins 2>&1 | tee /tmp/cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Preserve expected/found lines as well as the error and location;
            # one-line E0308 annotations are not actionable without the log.
            awk '/^error(\[|:)/{show=14} show>0 {print; show--}' /tmp/cargo-check.log \
              | head -120 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Test GFX light dependency audit
        run: |
          CARGO_TERM_COLOR=never cargo test --locked --bin gfx-light-audit 2>&1 | tee /tmp/gfx-audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^test result:|^error(\[|:)|panicked at" /tmp/gfx-audit.log | head -5 \
              | while IFS= read -r line; do echo "::error::$line"; done
            sed -n '/^failures:$/,/^test result:/p' /tmp/gfx-audit.log | head -20 \
              | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
          fi
          exit "$status"
      - name: Run viewer unit tests
        run: |
          CARGO_TERM_COLOR=never cargo test --locked --bin perfect-world-explorer 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Preserve compiler spans/help next to a test-only type error; the
            # remote log archive is not reliably accessible from the API.
            grep -A9 -E "^error(\[|:)" /tmp/cargo-test.log | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "^test result:|^error(\[|:)|panicked at" /tmp/cargo-test.log | head -5 \
              | while IFS= read -r line; do echo "::error::$line"; done
            # The failing test names, which is what actually needs naming.
            sed -n '/^failures:$/,/^test result:/p' /tmp/cargo-test.log | head -30 \
              | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
          fi
          # Every corpus test that could not look at the data prints SKIPPED
          # and is counted on stderr; a run that never says so is claiming
          # coverage it did not measure. Put the count in the job summary so a
          # skip cannot pass as a pass, and fail if the run skipped at all
          # without anyone saying why (2.11).
          # `grep -c` exits 1 when it finds nothing, which `set -e` would turn
          # into a failed job on the *good* path; the `|| true` keeps the count
          # and drops only the exit status.
          skipped=$(grep -c 'SKIPPED: ' /tmp/cargo-test.log || true)
          skipped=${skipped:-0}
          # `awk`, not `bc`: the runner image is not guaranteed to carry `bc`,
          # and a missing calculator must not silently report zero tests.
          # The count sits immediately before `passed;` (with the semicolon),
          # so match the *next* field as a prefix rather than for equality.
          passed=$(awk '/test result: ok\./ {
              for (i = 1; i <= NF; i++)
                  if ($(i + 1) ~ /^passed/) total += $i
            } END { print total + 0 }' /tmp/cargo-test.log)
          {
            echo "### Viewer unit tests"
            echo ""
            echo "| | count |"
            echo "|---|---|"
            echo "| passed | ${passed:-0} |"
            echo "| skipped (no corpus file) | ${skipped:-0} |"
            echo ""
            if [ "${skipped:-0}" -gt 0 ]; then
              echo "A skipped corpus test proves nothing about the shipped data:"
              echo "its archive is not staged on this runner. Each line below names"
              echo "the file it could not open."
              echo ""
              echo '```'
              grep 'SKIPPED: ' /tmp/cargo-test.log | head -40 || true
              echo '```'
            else
              echo "No test skipped: every corpus assertion looked at its data."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The measurement channel. The job log comes back empty through the API,
      # so every number the compatibility matrix needs is written as JSON and
      # committed to a branch instead of printed. The matrix tool refuses to
      # exit zero if any category came back `silent` -- a reader that returned
      # nothing without a reason is the failure this whole exercise targets.
      - name: Measure every staged client into ci-results
        # Always runs. A failure in an unrelated step above used to skip this one,
        # and the publish step then announced "the measure step did not run" as a
        # result -- three runs in a row measured nothing. Measurement is the
        # point of the run, so it must not sit behind anything else.
        if: always()
        run: |
          set -euo pipefail
          rm -rf ci-results
          mkdir -p ci-results
          # Each client is a directory. The workflow stages them under
          # /tmp/clients/<name>/ when a run provides them; a checkout without
          # them records that fact rather than silently measuring nothing.
          args=()
          # The committed fixtures: real client bytes, small enough to check in.
          # These are what make every cell measurable on this runner, because a
          # checkout has no client install and CI cannot reach Drive.
          for d in tests/fixtures/clients/*/; do
            [ -d "$d" ] || continue
            args+=("$(basename "$d")=$d")
          done
          # A run that stages real clients under /tmp/clients/ measures those too.
          for d in /tmp/clients/*/; do
            [ -d "$d" ] || continue
            args+=("$(basename "$d")=$d")
          done
          if [ ${#args[@]} -eq 0 ]; then
            # Nothing to measure is not a result, and writing a placeholder file
            # for it is how a stale none.json survived on the ci-results branch
            # while the real clients went unmeasured. Fail instead.
            echo "::error::no client files were staged, so nothing was measured"
            exit 1
          else
            # Surface the tool's own failure as an annotation: the raw step log
            # is not retrievable, so an unannotated non-zero exit is invisible.
            # `PIPESTATUS`, not `if ! cmd | tee`: the pipe's status is tee's,
            # which succeeds even when the tool failed.
            set +e
            CARGO_TERM_COLOR=never cargo run --locked --bin client-matrix-json \
              -- ci-results "${args[@]}" 2>&1 | tee /tmp/matrix.log
            tool_status=${PIPESTATUS[0]}
            set -e
            if [ "$tool_status" -ne 0 ]; then
              grep -E "^error|panicked|SILENT|cannot|-->" /tmp/matrix.log | head -20 \
                | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            fi
          fi
          # A missing file per client is a failed measurement, not a zero. The
          # expected set is what the loop above staged, so a client that produced
          # no JSON at all is named here rather than going unnoticed.
          for spec in "${args[@]}"; do
            name=${spec%%=*}
            f="ci-results/$name.json"
            if [ ! -s "$f" ]; then
              echo "::error::no measurement was written for client '$name' (expected $f)"
              exit 1
            fi
          done
      - name: Publish ci-results
        if: always()
        run: |
          set -euo pipefail
          # The measure step above is what writes this; if it failed before
          # creating the directory we still publish a record of that, because
          # "no measurements" is a result and a missing directory is not.
          if [ ! -d ci-results ]; then
            mkdir -p ci-results
            # Annotate the failure, but do NOT write a none.json: a file called
            # "none.json" is indistinguishable from a real measurement once it
            # is on the ci-results branch, and it is not one. The job is meant
            # to fail in this case anyway.
            echo "::error::the measure step wrote no ci-results; measurement did not run"
          fi
          # One file per client, and the job fails if any is missing.
          count=$(ls -1 ci-results/*.json 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::ci-results holds no JSON; the measurement did not run"
            exit 1
          fi
          echo "::notice::$count client JSON file(s) measured"
          {
            echo "### Client measurements"
            echo ""
            echo "| file | bytes |"
            echo "|---|---|"
            for f in ci-results/*.json; do
              echo "| \`$(basename "$f")\` | $(wc -c < "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Commit to a separate branch so the results survive the run without
          # touching the PR's own history.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-results-tmp 2>/dev/null || git checkout ci-results-tmp
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f ci-results
          git commit -q -m "ci-results: measurements from ${GITHUB_SHA}" || echo "no change"
          git push -f origin HEAD:ci-results
      # Formatting is checked after the unit tests and before the Vulkan
      # installs: rustfmt needs no GPU, so it must not sit behind an
      # environment-sensitive step, but it must not run *before* the tests
      # either — a formatting nit would then skip them, which is how three
      # assertions went unverified for a day.
      - name: Check formatting
        run: |
          # `cargo fmt --check` already prints the "Diff in ..." hunks it wants;
          # capture them because the raw step log is not always retrievable.
          # (`rustfmt --diff` is not an option, so this is the only source.)
          cargo fmt --all -- --check > /tmp/fmt.check 2>&1 || true
          if [ -s /tmp/fmt.check ]; then
            echo "::error::rustfmt wants changes; the diff is posted as a PR comment"
            exit 1
          fi
      # Job logs are not always retrievable through the API, and a PR comment is
      # not always posted either, so the diff also goes out as annotations: the
      # annotations are what the agent can read back.
      - name: Echo formatting diff
        if: failure()
        run: |
          [ -s /tmp/fmt.check ] || exit 0
          head -200 /tmp/fmt.check | while IFS= read -r line; do
            echo "::error file=rustfmt::$line"
          done
      # Annotations are capped per check run and the GPU checks fill it with
      # notices, so the diff is posted where it can actually be read.
      - name: Post formatting diff
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -n "$PR" ] || exit 0
          # An earlier failure leaves no rustfmt diff; post nothing rather than
          # an empty comment.
          [ -s /tmp/fmt.check ] || exit 0
          { echo 'rustfmt wants these changes:'; echo '```diff'; \
            head -600 /tmp/fmt.check; echo '```'; } > /tmp/fmt.md
          # Replace this workflow's previous comment rather than adding to it.
          # The comment is the only readable copy of the diff, and after a few
          # runs the thread holds diffs that were already applied, which makes a
          # fixed one look unfixed. Deleting first means one comment, current.
          for id in $(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
              --paginate -q '.[]|select(.user.login=="github-actions[bot]")|select(.body|startswith("rustfmt wants these changes:"))|.id'); do
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id" || true
          done
          gh pr comment "$PR" --body-file /tmp/fmt.md
      - name: Verify bounded lossless terrain RAM residency
        run: |
          cargo run --locked --bin terrain-memory-check
          cargo run --locked --bin terrain-memory-check -- --full-world
      - name: Install software Vulkan for Phase 1 shader checks
        run: |
          # Same flaky mirror as the build dependencies above: retry the install
          # instead of failing the three Vulkan checks behind it, and print apt's
          # own diagnosis as annotations if every attempt fails.
          #
          # `dpkg -s` is not enough evidence: an image can report the package
          # installed while the driver file itself is absent (the step used to
          # exit 0 on `dpkg -s` and the sRGB step behind it then reported
          # "no lavapipe ICD"), so the actual ICD is what gets checked, and a
          # package that claims to be installed without one is reinstalled.
          icd_present() {
            find /usr/share/vulkan/icd.d /usr/local/share/vulkan/icd.d /etc/vulkan/icd.d \
              -maxdepth 1 -name '*lvp*' -print -quit 2>/dev/null | grep -q .
          }
          if dpkg -s mesa-vulkan-drivers >/dev/null 2>&1 && icd_present; then
            echo "mesa-vulkan-drivers already installed, lavapipe ICD present"
            exit 0
          fi
          if dpkg -s mesa-vulkan-drivers >/dev/null 2>&1; then
            echo "mesa-vulkan-drivers claims to be installed but the lavapipe ICD is missing; reinstalling"
          fi
          status=1
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get install -y --no-install-recommends \
              --reinstall mesa-vulkan-drivers 2>&1 | tee /tmp/vulkan-apt.log; then
              status=0
              break
            fi
            echo "apt attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          if [ "$status" -ne 0 ]; then
            grep -v '^$' /tmp/vulkan-apt.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Test Librarian preview with an sRGB window
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
          PW_LIBRARIAN_SYNTHETIC_GPU: "1"
        run: |
          # The raw step log is served from blob storage and is not reachable
          # from everywhere, so the failure is also encoded in the exit code,
          # which the check-run annotation always reports:
          #   41  no lavapipe ICD on the image   (probe fails, test never ran)
          #   42  the wgpu test itself failed
          log=/tmp/srgb-window.log
          : >"$log"
          # Mesa has renamed the software ICD more than once, so look for any
          # lavapipe driver description rather than one exact file name.
          icd=""
          for dir in /usr/share/vulkan/icd.d /usr/local/share/vulkan/icd.d /etc/vulkan/icd.d; do
            found="$(find "$dir" -maxdepth 1 -name '*lvp*' -print -quit 2>/dev/null || true)"
            if [ -n "$found" ]; then icd="$found"; continue; fi
          done
          # Some Mesa builds ship the driver library without an ICD manifest.
          # Writing the manifest here is what the loader needs and what an
          # installed driver already provides, so it adds no assumption about
          # the driver itself — only the path to it.
          # The install step above can succeed against a mirror that serves an
          # empty package, and it can also be skipped as "already installed" on
          # an image whose driver was stripped. Both leave this step with no
          # driver, which is not a code failure: install it here once more
          # before deciding that.
          if [ -z "$icd" ]; then
            for attempt in 1 2 3; do
              sudo apt-get install -y --no-install-recommends --reinstall \
                mesa-vulkan-drivers >/dev/null 2>&1 || true
              for dir in /usr/share/vulkan/icd.d /usr/local/share/vulkan/icd.d /etc/vulkan/icd.d; do
                found="$(find "$dir" -maxdepth 1 -name '*lvp*' -print -quit 2>/dev/null || true)"
                if [ -n "$found" ]; then icd="$found"; break; fi
              done
              [ -n "$icd" ] && break
              echo "no lavapipe ICD after install attempt ${attempt}" >&2
              sleep 10
            done
          fi
          if [ -z "$icd" ]; then
            driver="$(find /usr/lib /lib -name 'libvulkan_lvp.so*' -print -quit 2>/dev/null || true)"
            if [ -n "$driver" ]; then
              icd="$RUNNER_TEMP/lvp_icd.json"
              cat >"$icd" <<JSON
          {
            "file_format_version": "1.0.0",
            "ICD": { "library_path": "$driver", "api_version": "1.3.0" }
          }
          JSON
              echo "lavapipe has no ICD manifest; wrote one for $driver" >>"$log"
            fi
          fi
          echo "VK_ICD_FILENAMES=$icd" >>"$log"
          ls -l /usr/share/vulkan/icd.d >>"$log" 2>&1 || true
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD: the software Vulkan driver is missing"
            cat "$log"
            exit 41
          fi
          export VK_ICD_FILENAMES="$icd"
          status=0
          cargo test --locked --bin perfect-world-explorer \
            srgb_window_uses_encoded_unorm_preview_attachment 2>&1 | tee -a "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::sRGB window test failed"
            grep -E "panicked at|^test result:|^error(\[|:)|No suitable|RequestDevice" "$log" \
              | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 "$log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 42
          fi
      - name: Run Phase 1 production shader regressions
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          # Mesa renamed this file on newer Ubuntu images. Resolve the installed
          # lavapipe ICD rather than silently disabling Vulkan with a stale path.
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          # Name the binary that failed: this step runs 22 checks and a bare
          # exit code does not say which one broke.
          run_check() {
            # `if ! cmd | tee` tests *tee's* status, which is always 0, so the
            # failure branch never ran and every check silently passed. Take the
            # command's own status from PIPESTATUS.
            cargo run --locked --bin "$1" 2>&1 | tee "/tmp/gpu-$1.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::error::gpu check failed: $1"
              # The reason, not just the name: a shader mismatch reports the
              # expected and actual values on these lines.
              # The assert message itself, which carries the actual and
              # expected values, plus the panic location.
              grep -A3 -E "panicked at" "/tmp/gpu-$1.log" \
                | head -12 | while IFS= read -r line; do echo "::error::$1: $line"; done
              exit 1
            fi
          }
          run_check display-gamma-gpu-check
          run_check post-gpu-check
          run_check bloom-gpu-check
          run_check bmd-baked-gpu-check
          run_check bmd-sided-gpu-check
          run_check bmd-depth-gpu-check
          run_check scenery-pass-gpu-check
          run_check world-atlas-gpu-check
          run_check grass-instance-gpu-check
          run_check model-light-gpu-check
          run_check skin-pose-gpu-check
          run_check skin-palette-gpu-check
          run_check model-texture-gpu-check
          run_check model-receiver-gpu-check
          run_check model-draw-gpu-check
          run_check phase1-fog-gpu-check
          # Phase 5: native sky resource swap (`0x4203f4..0x420807` / `0x79aeb0`)
          # plus reflection and altitude invariants (P5.07, P5.08). Compiles the
          # production sky WGSL, proves the two-set crossfade changes pixels,
          # proves camera altitude cannot move a sky ray, and proves every view
          # reuses one snapshot without advancing the transition.
          run_check phase5-sky-transition-gpu-check
          # Validate both newly integrated P5 weather shaders on lavapipe. They
          # are otherwise only created when a user loads a client world.
          run_check phase5-weather-cloud-shader-check
          run_check terrain-refraction-gpu-check
          run_check water-fog-gpu-check
          # Near/far LOD continuity: runs both real terrain vertex entry points
          # (`vs`, `vs_far`) on identical geometry and compares the interpolated
          # normal in RGB plus the packed LOD flag in alpha.
          run_check terrain-lod-gpu-check
          # Phase 4 vegetation diagnostics: tree LOD/lighting preservation,
          # grass mip coverage/upload, and synthetic authored tree mip upload.
          run_check tree-lod-gpu-check
          run_check grass-gpu-mip-check
          run_check tree-authored-mip-gpu-check
      # The headless effect preview is the only place the effect pass is
      # rendered without a window. Its smoke case authors one sprite root and
      # asserts the card reaches the pass and covers pixels, so a change that
      # breaks the harness cannot quietly turn the other previews into a folder
      # of empty PNGs.
      - name: Run the headless effect preview smoke test
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          CARGO_TERM_COLOR=never cargo test --locked --bin perfect-world-explorer \
            effect_preview_smoke -- --nocapture 2>&1 | tee /tmp/effect-preview-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::effect preview smoke test failed"
            grep -E "panicked at|^error(\[|:)|^test result:|smoke:" /tmp/effect-preview-smoke.log \
              | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 /tmp/effect-preview-smoke.log \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Keep the effect preview smoke frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-preview-smoke
          path: /tmp/pwe-effect-preview-smoke.png
          if-no-files-found: ignore
      - name: Run terrain per-view GPU check
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          cargo run --locked --bin terrain-view-gpu-check
          cargo test --locked --bin perfect-world-explorer cutoff_gpu_residency_repacking -- --ignored

      # Formatting is cosmetic: run it after the compile, test and shader steps
      # so a whitespace diff can never hide a real failure behind it.
  windows:
    name: Windows executable (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Prepare MSVC environment for SDK bridge builds
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x64 tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path -LiteralPath $vcvars)) { throw "MSVC environment script not found: $vcvars" }
          $capture = Join-Path $env:RUNNER_TEMP 'capture-msvc-env.cmd'
          @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          set
          "@ | Set-Content -LiteralPath $capture -Encoding ascii
          $msvcEnvironment = & cmd.exe /d /c $capture
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with exit $LASTEXITCODE" }
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion')) {
            $entry = $msvcEnvironment | Where-Object { $_.StartsWith("$name=", [StringComparison]::OrdinalIgnoreCase) } | Select-Object -First 1
            if (-not $entry) { throw "MSVC environment did not define $name" }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value $entry -Encoding utf8
          }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
      - name: Rebuild the embedded 32-bit SpeedTree bridge
        shell: msys2 {0}
        run: g++ -static -O2 -municode tools/speedtree/bake.cpp -o tools/speedtree/speedtree-bake.exe
      - uses: Swatinem/rust-cache@v2
      - name: Capture gamma words with native x86 MSVCRT exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x86 tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"
          $exe = Join-Path $env:RUNNER_TEMP "native-gamma.exe"
          $prefix = Join-Path $env:RUNNER_TEMP "native-gamma"
          $command = "call `"$vcvars`" && cl /nologo /W4 /O2 tools\capture-native-gamma-x87.c /Fe:`"$exe`" && `"$exe`" `"$prefix`""
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NativeGammaX87Words
          path: ${{ runner.temp }}/native-gamma-pc*.bin
          if-no-files-found: error
      - name: Compare production gamma with independent x86 MSVCRT words
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "compare-gamma-words.exe"
          rustc --edition=2021 tools/check-native-gamma-words.rs -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe (Join-Path $env:RUNNER_TEMP "native-gamma-pc24.bin")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native gamma and glow CPU references on Windows
        shell: pwsh
        run: |
          # Keep CPU references for both the P4 vegetation material policy and
          # the P5 sky-swap machine in the Windows-native verification set.
          foreach ($module in @("gamma_curve", "glow_state", "post_plan", "color_chain", "fog_matrix", "client_region_shade", "client_region_stream", "client_regional_light", "gfx_color_track", "vegetation_material", "sky_transition")) {
            $exe = Join-Path $env:RUNNER_TEMP "$module-tests.exe"
            rustc --edition=2021 --test "src/$module.rs" -o $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build standalone viewer
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x64 tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path -LiteralPath $vcvars)) { throw "MSVC environment script not found: $vcvars" }
          $buildScript = Join-Path $env:RUNNER_TEMP 'build-viewer.cmd'
          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b %errorlevel%
          where cl.exe
          if errorlevel 1 exit /b %errorlevel%
          set CARGO_TERM_COLOR=never
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin perfect-world-explorer
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $buildScript -Encoding ascii
          $log = Join-Path $env:RUNNER_TEMP 'win-build.log'
          & cmd.exe /d /c $buildScript 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Host "::error::Windows viewer build failed (exit $status); diagnostic tail follows"
            Get-Content -LiteralPath $log -Tail 100 | ForEach-Object { Write-Host "::error::$_" }
            # A warning is not the reason the build failed, and the tail is full
            # of them, so the errors are what has to survive into the annotation
            # list. Ten is the most the annotation API accepts.
            $errors = Get-Content -LiteralPath $log |
              Select-String -Pattern '^error(\[|:)' |
              Select-Object -First 10
            if ($errors) {
              foreach ($line in $errors) { Write-Host ("::error::" + $line.Line) }
            } else {
              Write-Host "::error::the build failed without an 'error' line; see the job log"
            }
          }
          exit $status
      - name: Build audio corpus and scene diagnostics
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin audio-corpus-check --bin scene-sound-check
      - name: Test Windows audio decoding with synthetic fixtures
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-audio-tests.log'
          cargo test --locked --target x86_64-pc-windows-msvc --bin audio-corpus-check 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Host "::error::Windows audio fixture tests failed (exit $status); diagnostic tail follows"
            Get-Content -LiteralPath $log -Tail 100 | ForEach-Object { Write-Host "::error::$_" }
          }
          exit $status
      - name: Test world audio selection on Windows
        run: cargo test --locked --target x86_64-pc-windows-msvc --bin perfect-world-explorer world_audio::tests
      - name: Build the shipped survey tool
        shell: bash
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin bmd-overlap-survey
      - name: Stage portable viewer and installed modules
        shell: pwsh
        run: |
          # Validate the release ZIP too, but upload only the portable folder.
          ./tools/package-windows.ps1 `
            -Executable target/x86_64-pc-windows-msvc/release/perfect-world-explorer.exe `
            -Modules Modules `
            -OutputDirectory artifact `
            -ArchivePath "$env:RUNNER_TEMP/Perfect-World-Explorer-package-test.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Perfect-World-Explorer-Windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Download the uploaded portable artifact
        uses: actions/download-artifact@v4
        with:
          name: Perfect-World-Explorer-Windows-x64
          path: ${{ runner.temp }}/uploaded-viewer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Audit the uploaded artifact layout
        shell: pwsh
        run: |
          $uploaded = Join-Path $env:RUNNER_TEMP 'uploaded-viewer'
          $topLevel = @(Get-ChildItem -LiteralPath $uploaded -Force)
          if ($topLevel.Count -ne 1 -or $topLevel[0].Name -cne 'Perfect World Explorer') {
            throw 'The artifact must contain only the Perfect World Explorer top-level folder.'
          }
          $package = Join-Path $uploaded 'Perfect World Explorer'
          foreach ($relative in @(
            'Perfect-World-Explorer.exe',
            'dstorage.dll',
            'dstoragecore.dll',
            'DirectStorage/LICENSE.txt',
            'DirectStorage/NOTICES.txt',
            'Modules/Walker/module.ini',
            'SHA256SUMS.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $relative) -PathType Leaf)) {
              throw "Uploaded artifact is missing: $relative"
            }
          }
          if (Get-ChildItem -LiteralPath $package -Recurse -File | Where-Object { $_.Name -match '(?i)bmd.*survey|survey.*bmd' }) {
            throw 'The uploaded artifact contains a BMD survey executable.'
          }
